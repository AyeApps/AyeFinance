[project]
name = "aye-finance"
version = "1.0.0"
description = "AyeFinance Microservice Backend — Personal Financial Ledger"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
