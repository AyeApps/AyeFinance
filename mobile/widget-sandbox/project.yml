name: WidgetSandbox
options:
  bundleIdPrefix: com.ayeapps.ayefinance.sandbox
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    GCC_OPTIMIZATION_LEVEL: "0"

targets:
  WidgetSandboxApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: widgets
        excludes:
          - "AyeFinanceWidgets.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayeapps.ayefinance.sandbox
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetSandboxExtension.entitlements
    dependencies:
      - target: WidgetSandboxExtension

  WidgetSandboxExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayeapps.ayefinance.sandbox.widgets
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetSandboxExtension.entitlements
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        GCC_OPTIMIZATION_LEVEL: "0"
