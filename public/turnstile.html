<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Turnstile Verification</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cf-turnstile-container"></div>
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var siteKey = urlParams.get('sitekey') || '0x4AAAAAAEn3YN77Mt7jKxas';
      var theme = urlParams.get('theme') || 'dark';

      function post(type, data) {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: type, data: data }));
        }
      }

      function render() {
        if (!window.turnstile) return;
        try {
          window.turnstile.render('#cf-turnstile-container', {
            sitekey: siteKey,
            theme: theme,
            size: 'normal',
            callback: function(token) {
              post('token', token);
            },
            'error-callback': function(err) {
              post('error', err || 'error');
            },
            'expired-callback': function() {
              post('expired', null);
            }
          });
        } catch (e) {
          post('error', e.message);
        }
      }

      if (window.turnstile) {
        render();
      } else {
        var interval = setInterval(function() {
          if (window.turnstile) {
            clearInterval(interval);
            render();
          }
        }, 150);
        setTimeout(function() { clearInterval(interval); }, 8000);
      }
    })();
  </script>
</body>
</html>
