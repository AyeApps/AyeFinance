name: AyeFinance CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check backend/

      - name: Run Pytest Suite
        env:
          MONGODB_URL: mongodb://localhost:27017/aye_finance_ci
          JWT_SECRET_KEY: super_secure_secret_key_minimum_32_characters_for_ayeapps_atelier
        run: |
          pytest backend/app/tests --tb=short

  build-web:
    name: Web App Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Typecheck and Build Web
        run: |
          cd web
          npm run build
